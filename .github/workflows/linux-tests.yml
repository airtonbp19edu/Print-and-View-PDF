name: Linux tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 python3-pil python3-cryptography poppler-utils cups-client fonts-dejavu-core adwaita-icon-theme librsvg2-common xvfb xauth dbus-x11
      - name: Run complete test suite with GTK
        env:
          GSETTINGS_BACKEND: memory
        run: xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- /usr/bin/python3 -m unittest discover -s tests -v
