<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6fd6"/>
      <stop offset="1" stop-color="#1d3f8a"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
  </defs>

  <!-- fundo em cartão arredondado -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- pinguim genérico simples, à esquerda, atrás do documento -->
  <g transform="translate(16,34)">
    <ellipse cx="20" cy="52" rx="19" ry="22" fill="#0f1b33"/>
    <ellipse cx="20" cy="56" rx="12" ry="16" fill="#ffffff"/>
    <circle cx="20" cy="20" r="15" fill="#0f1b33"/>
    <circle cx="20" cy="24" r="9" fill="#ffffff"/>
    <circle cx="17" cy="17" r="2.2" fill="#ffffff"/>
    <polygon points="20,24 26,28 20,31" fill="#f4a623"/>
    <ellipse cx="7" cy="46" rx="5" ry="11" fill="#0f1b33" transform="rotate(-18 7 46)"/>
    <ellipse cx="33" cy="46" rx="5" ry="11" fill="#0f1b33" transform="rotate(18 33 46)"/>
  </g>

  <!-- documento com dobra -->
  <g transform="translate(46,22)">
    <path d="M4,0 H50 L64,14 V92 A4,4 0 0 1 60,96 H4 A4,4 0 0 1 0,92 V4 A4,4 0 0 1 4,0 Z" fill="url(#doc)" stroke="#c7cede" stroke-width="1"/>
    <path d="M50,0 V10 A4,4 0 0 0 54,14 H64 Z" fill="#c7cede"/>
    <rect x="12" y="34" width="40" height="5" rx="2.5" fill="#aab3c5"/>
    <rect x="12" y="46" width="40" height="5" rx="2.5" fill="#aab3c5"/>
    <rect x="12" y="58" width="26" height="5" rx="2.5" fill="#aab3c5"/>
  </g>

  <!-- faixa PDF -->
  <g transform="translate(52,84)">
    <rect x="0" y="0" width="60" height="26" rx="4" fill="#d6362f"/>
    <text x="30" y="19" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="15" fill="#ffffff">PDF</text>
  </g>
</svg>
